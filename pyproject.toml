[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resume-writer"
version = "0.1.0"
description = "AI-powered resume rewriting and job-description tailoring application"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=1.0,<3.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "streamlit>=1.40,<2.0",
    "python-docx>=1.1,<2.0",
    "pypdf>=5.0,<7.0",
    "reportlab>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]